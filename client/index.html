<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->

    <meta property="og:url" content="https://prizmvision.com/" />
    <meta property="og:title" content="Prizm — Vision Benefit Campaign Automation for Optometry Practices" />

    <meta name="twitter:description" content="Your patients have $150–$200 in unused vision benefits sitting unclaimed. Prizm finds them, messages them, and brings them back in." />

    <!-- Structured data — helps Google show logo and rich results -->

      "@context": "https://schema.org",

          "@type": "UnitPriceSpecification",

      "publisher": {
        "@type": "Organization",
        "name": "Prizm",
        "url": "https://prizmvision.com",
        "logo": "https://prizmvision.com/prism.svg",
        "contactPoint": {
          "@type": "ContactPoint",

      }
