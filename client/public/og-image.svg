<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020617"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="56" height="56" rx="14" fill="#0d9488"/>
  <path d="M108 92L108 124L91 124Z" fill="#ffffff"/>
  <path d="M108 92L125 124L108 124Z" fill="#ffffff" fill-opacity="0.55"/>

  <!-- Prizm wordmark -->
  <text x="152" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white">Prizm</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="white">Year-round campaigns</text>
  <text x="80" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="white">that drive optical revenue.</text>

  <!-- Subheadline -->
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">Send each patient their exact VSP &amp; EyeMed dollar amount.</text>
  <text x="80" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">Not just Q4 — every month of the year.</text>

  <!-- Example message pill -->
  <rect x="80" y="516" width="860" height="60" rx="12" fill="#134e4a" stroke="#0d9488" stroke-width="1.5"/>
  <text x="104" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#5eead4">"Mrs. Johnson has $200 in EyeMed. She'll let it expire again this year."</text>

  <!-- URL -->
  <text x="1120" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#0d9488" text-anchor="end">prizmvision.com</text>
</svg>
